name: Publish Mooncakes module
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-module
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Validate release
        run: |
          moon version --all
          moon check --target all --deny-warn --warn-list '-78-33'
          moon test --target all
          moon test --target all --release
          moon info --target all
          moon fmt
          git diff --exit-code
          python3 scripts/check_package.py
          (cd examples/js_svg && moon build --target js --release && node ../../scripts/check_demo.cjs)
      - name: Publish
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_MOONBIT_COMMUNITY_TOKEN }}
        run: |
          test -n "$MOONCAKES_TOKEN"
          trap 'rm -f "$HOME/.moon/credentials.json"' EXIT
          printf '%s' "$MOONCAKES_TOKEN" > "$HOME/.moon/credentials.json"
          moon publish --dry-run
          moon publish
